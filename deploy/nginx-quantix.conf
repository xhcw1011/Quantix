server {
    listen 9119;
    server_name _;

    root /opt/quantix/web;
    index index.html;

    client_max_body_size 10m;

    # API + WebSocket reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:9118;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (harmless on plain HTTP requests)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $quantix_connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # SPA fallback (vite/react-router client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
