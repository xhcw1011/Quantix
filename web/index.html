<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Pin a desktop layout viewport: the app has no dedicated mobile UI (only a
         cramped md-breakpoint fallback), so on phones we render the full PC layout
         zoomed-to-fit and pannable instead of the broken narrow reflow. 1024 clears
         the md (768px) breakpoint so the desktop sidebar + tables render, while
         staying as large as possible on a phone. -->
    <meta name="viewport" content="width=1024" />
    <title>Quantix</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
